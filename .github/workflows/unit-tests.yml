name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run unit tests with coverage
        id: tests
        run: swift test --enable-code-coverage

      - name: Export LCOV coverage report
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          mkdir -p coverage
          xcrun llvm-cov export \
            --format=lcov \
            --ignore-filename-regex='(/\.build/|/tests/)' \
            --instr-profile="$BIN_PATH/codecov/default.profdata" \
            "$BIN_PATH/SuohaiDomainTests.xctest/Contents/MacOS/SuohaiDomainTests" \
            --object "$BIN_PATH/SuohaiApplicationTests.xctest/Contents/MacOS/SuohaiApplicationTests" \
            --object "$BIN_PATH/SuohaiAdaptersTests.xctest/Contents/MacOS/SuohaiAdaptersTests" \
            > coverage/lcov.info

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Add workflow summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '## 🧪 Unit tests'
            echo
            echo '| Detail | Value |'
            echo '| --- | --- |'
            printf '| Job result | %s |\n' "$JOB_STATUS"
            printf '| Test step | %s |\n' "${TEST_STATUS:-not run}"
            printf '| Trigger | %s by %s |\n' "$EVENT_NAME" "$ACTOR"
            printf '| Ref | %s |\n' "$REF_NAME"
            printf '| Runner | %s / %s |\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf '| Workflow run | [View run](%s) |\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
